name: HGNC_search CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hgnc .
      - name: Run pytest
        run: docker run --rm hgnc python -m pytest

